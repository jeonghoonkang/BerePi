#[directories]
#SEARCH_DIR=/home/tinyos/webdav/media/test
SEARCH_DIR="/home/tinyos/webdav/media/send/tx/Blade Runner 2049 (2017) [2160p] [4K] [BluRay] [5.1] [YTS.MX]"
LOG_DIR=/tmp/log/video_converter
OUTPUT_SUBDIR=mp4                 # 각 원본 디렉터리 아래에 생성할 MP4 출력 폴더명

#[ffmpeg]
THREADS=2                          # 권장: 0 (auto), 2 (보수적), $(nproc) (최대)
PRESET=fast                      # ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
CRF=18                             # 18~28 (낮을수록 고화질)
AUDIO_BITRATE=192k               # 오디오 비트레이트 (64k, 128k, 192k, 256k 등)

#[logging]
M_LOG=video_convert.log          # 메인 로그 파일명
FILE_LIST_LOG=video_file_list.log      # 파일 목록 로그
CONVERTED_LOG=video_converted.log      # 변환 완료 로그

#[options]
SKIP_EXISTING=true                 # 기존 MP4 파일 건너뛰기
LOCK_FILE=/tmp/video_converter.lock
